<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>呲啦起始页 · 重构预览（昼夜天幕）</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Sora:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --font-display:'Space Grotesk','Noto Sans SC',sans-serif;
    --font-body:'Sora','Noto Sans SC',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
    --paper:#FBF7F0; --ink:#1F2A30; --muted:#6B7780;
    --surface:rgba(255,255,255,.72); --surface-2:rgba(255,255,255,.5);
    --border:rgba(31,42,48,.10); --accent:#FF6B4A; --accent-soft:rgba(255,107,74,.14);
    --accent-shadow:rgba(255,107,74,.40); --radius:18px; --shadow:0 10px 30px -12px rgba(31,42,48,.28);
  }
  html[data-theme="night"]{
    --paper:#07151C; --ink:#EAF2F4; --muted:#8AA0A6;
    --surface:rgba(255,255,255,.06); --surface-2:rgba(255,255,255,.04);
    --border:rgba(255,255,255,.10); --accent:#FFC773; --accent-soft:rgba(255,199,115,.16);
    --accent-shadow:rgba(255,199,115,.35); --shadow:0 14px 38px -16px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--font-body); color:var(--ink); overflow:hidden;
    background:var(--paper); transition:color .6s ease, background .6s ease;
  }
  /* ===== 昼夜天幕背景 ===== */
  .sky{position:fixed; inset:0; z-index:-2; transition:background 1.4s ease}
  .stars{position:fixed; inset:0; z-index:-1; opacity:0; transition:opacity 1.4s ease;
    background-image:
      radial-gradient(1.4px 1.4px at 12% 18%, #fff, transparent),
      radial-gradient(1.2px 1.2px at 28% 42%, #fff, transparent),
      radial-gradient(1.6px 1.6px at 47% 12%, #fff, transparent),
      radial-gradient(1.1px 1.1px at 63% 33%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 78% 22%, #fff, transparent),
      radial-gradient(1.2px 1.2px at 88% 47%, #fff, transparent),
      radial-gradient(1.3px 1.3px at 35% 28%, #fff, transparent),
      radial-gradient(1.1px 1.1px at 70% 14%, #fff, transparent);
  }
  .horizon{position:fixed; left:0; right:0; bottom:0; height:46%; z-index:-1;
    background:radial-gradient(120% 80% at 50% 120%, var(--horizon-glow,rgba(255,200,140,.0)), transparent 70%);
    transition:background 1.4s ease}
  .orb{position:fixed; width:128px; height:128px; border-radius:50%; z-index:-1;
    transform:translate(-50%,-50%); transition:left 1.2s ease, top 1.2s ease, background 1.4s ease, box-shadow 1.4s ease;
    background:radial-gradient(circle at 36% 34%, #fff, var(--orb-color,#FFE9B0));
    box-shadow:0 0 90px 24px var(--orb-glow,rgba(255,220,150,.5));}
  /* ===== 顶栏 ===== */
  .topbar{position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between;
    align-items:center; padding:22px 30px; z-index:5}
  .brand{font-family:var(--font-display); font-weight:700; font-size:21px; letter-spacing:-.01em}
  .brand b{color:var(--accent); font-weight:500; margin-left:7px; font-size:14px; font-family:var(--font-body)}
  .top-actions{display:flex; gap:8px}
  .pill-btn{display:inline-flex; align-items:center; gap:7px; height:38px; padding:0 14px;
    border-radius:999px; border:1px solid var(--border); background:var(--surface);
    color:var(--ink); font-size:13px; cursor:pointer; backdrop-filter:blur(8px);
    transition:transform .15s ease-out, border-color .2s ease, background .2s ease}
  .pill-btn:hover{transform:translateY(-2px); border-color:var(--accent)}
  .pill-btn:active{transform:translateY(0) scale(.97)}
  /* ===== 主舞台 ===== */
  .stage{min-height:100%; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:30px; padding:96px 24px 120px}
  .clock{text-align:center}
  .time{font-family:var(--font-display); font-weight:600; font-size:clamp(58px,12vw,108px);
    line-height:.96; letter-spacing:-.03em; font-variant-numeric:tabular-nums}
  .meta{margin-top:12px; font-size:15px; color:var(--muted); letter-spacing:.02em}
  .meta .dot{margin:0 8px; opacity:.5}
  .day-progress{width:min(440px,82%); height:4px; border-radius:999px; background:var(--border);
    margin:20px auto 0; overflow:hidden}
  .day-bar{height:100%; width:0; border-radius:999px;
    background:linear-gradient(90deg,var(--accent),#FFD194); transition:width .8s cubic-bezier(.19,1,.22,1)}
  /* ===== 搜索 ===== */
  .search{display:flex; align-items:center; gap:6px; width:min(580px,92%);
    background:var(--surface); border:1px solid var(--border); border-radius:999px;
    padding:7px 7px 7px 8px; box-shadow:var(--shadow); backdrop-filter:blur(10px);
    transition:border-color .2s ease, box-shadow .2s ease}
  .search:focus-within{border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft)}
  .engines{display:flex; gap:4px; padding-right:6px; border-right:1px solid var(--border)}
  .engine{height:34px; padding:0 12px; border-radius:999px; border:none; background:transparent;
    color:var(--muted); font-size:13px; font-family:var(--font-body); cursor:pointer;
    transition:background .15s ease, color .15s ease}
  .engine.active{background:var(--accent-soft); color:var(--accent); font-weight:500}
  .search input{flex:1; border:none; background:transparent; outline:none; font-size:15px;
    font-family:var(--font-body); color:var(--ink); padding:0 10px; min-width:0}
  .search input::placeholder{color:var(--muted)}
  .search-go{flex:none; width:42px; height:42px; border-radius:50%; border:none; cursor:pointer;
    background:var(--accent); color:#fff; font-size:18px; display:grid; place-items:center;
    transition:transform .15s ease-out, filter .2s ease}
  .search-go:hover{transform:scale(1.06)}
  .search-go:active{transform:scale(.95)}
  /* ===== 导航卡片 ===== */
  .dials{width:min(760px,94%); display:flex; flex-direction:column; gap:18px}
  .group-label{font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted);
    padding-left:4px; font-weight:600}
  .tiles{display:flex; flex-wrap:wrap; gap:14px}
  .tile{width:92px; display:flex; flex-direction:column; align-items:center; gap:11px;
    padding:16px 8px 14px; border-radius:var(--radius); background:var(--surface);
    border:1px solid var(--border); box-shadow:var(--shadow); cursor:pointer;
    backdrop-filter:blur(8px);
    transition:transform .18s cubic-bezier(.19,1,.22,1), box-shadow .18s ease, border-color .18s ease;
    opacity:0; animation:rise .5s cubic-bezier(.19,1,.22,1) forwards}
  @keyframes rise{from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:translateY(0)}}
  .tile:hover{transform:translateY(-6px); border-color:var(--accent);
    box-shadow:0 20px 44px -16px var(--accent-shadow)}
  .tile:active{transform:translateY(-2px) scale(.98)}
  .ico{width:48px; height:48px; border-radius:15px; display:grid; place-items:center;
    color:#fff; font-weight:600; font-size:18px; font-family:var(--font-display);
    box-shadow:0 6px 16px -6px rgba(0,0,0,.35)}
  .tile .name{font-size:13px; color:var(--ink); font-weight:500}
  /* ===== 底部 dock ===== */
  .dock{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); display:flex; gap:4px;
    padding:7px; background:var(--surface); border:1px solid var(--border); border-radius:999px;
    box-shadow:var(--shadow); backdrop-filter:blur(10px); z-index:5}
  .dock button{width:42px; height:42px; border-radius:50%; border:none; background:transparent;
    color:var(--ink); cursor:pointer; display:grid; place-items:center; font-size:17px;
    transition:background .15s ease, color .15s ease, transform .15s ease-out}
  .dock button:hover{background:var(--accent-soft); color:var(--accent); transform:translateY(-2px)}
  .dock button:active{transform:scale(.94)}
  @media (hover:none){.tile:hover,.pill-btn:hover,.dock button:hover{transform:none}}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important; transition:none!important}
    .tile{opacity:1}
  }
</style>
</head>
<body>
  <div class="sky" id="sky"></div>
  <div class="stars" id="stars"></div>
  <div class="horizon" id="horizon"></div>
  <div class="orb" id="orb"></div>

  <header class="topbar">
    <div class="brand">呲啦<b>起始页</b></div>
    <div class="top-actions">
      <button class="pill-btn" id="themeBtn">🌗 <span id="themeTxt">自动</span></button>
    </div>
  </header>

  <main class="stage">
    <section class="clock">
      <div class="time" id="time">--:--</div>
      <div class="meta"><span id="period">—</span><span class="dot">·</span><span id="date">—</span></div>
      <div class="day-progress"><div class="day-bar" id="dayBar"></div></div>
    </section>

    <form class="search" id="search" autocomplete="off">
      <div class="engines" id="engines">
        <button type="button" class="engine active" data-engine="baidu">百度</button>
        <button type="button" class="engine" data-engine="google">Google</button>
        <button type="button" class="engine" data-engine="bing">Bing</button>
      </div>
      <input id="searchInput" placeholder="搜索，或输入网址直达" />
      <button class="search-go" type="submit" aria-label="搜索">⌕</button>
    </form>

    <section class="dials">
      <div class="group-label">常用</div>
      <div class="tiles" id="tiles-common"></div>
      <div class="group-label">工作</div>
      <div class="tiles" id="tiles-work"></div>
    </section>
  </main>

  <footer class="dock">
    <button title="主题" id="dockTheme">🌗</button>
    <button title="布局">▦</button>
    <button title="时钟样式">◷</button>
    <button title="设置">⚙</button>
  </footer>

<script>
  // ---------- 数据 ----------
  const COMMON=[
    {n:'百度',c:'#2932E1'},{n:'哔哩哔哩',c:'#FB7299'},{n:'知乎',c:'#0084FF'},
    {n:'GitHub',c:'#24292F'},{n:'邮箱',c:'#FF6B4A'},{n:'网盘',c:'#00B386'}
  ];
  const WORK=[
    {n:'Figma',c:'#A259FF'},{n:'飞书',c:'#3370FF'},{n:'掘金',c:'#1E80FF'},
    {n:'语雀',c:'#00B386'},{n:'Notion',c:'#111111'},{n:'蓝湖',c:'#1B73E8'}
  ];

  function buildTiles(list, mount){
    list.forEach((t,i)=>{
      const el=document.createElement('div');
      el.className='tile';
      el.style.animationDelay=(i*55)+'ms';
      el.innerHTML=`<div class="ico" style="background:${t.c}">${t.n[0]}</div><div class="name">${t.n}</div>`;
      mount.appendChild(el);
    });
  }
  buildTiles(COMMON, document.getElementById('tiles-common'));
  buildTiles(WORK, document.getElementById('tiles-work'));

  // ---------- 时钟 ----------
  const WEEK=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  function tick(){
    const d=new Date();
    const h=d.getHours(), m=d.getMinutes();
    const pad=x=>String(x).padStart(2,'0');
    document.getElementById('time').textContent=pad(h)+':'+pad(m);
    document.getElementById('period').textContent = h<6?'凌晨':h<12?'上午':h<14?'中午':h<18?'下午':'晚上';
    document.getElementById('date').textContent=`${d.getMonth()+1}月${d.getDate()}日 ${WEEK[d.getDay()]}`;
    const frac=(h*60+m)/(24*60);
    document.getElementById('dayBar').style.width=(frac*100).toFixed(1)+'%';
    paintSky(h+m/60, frac);
  }

  // ---------- 昼夜天幕 ----------
  const KEYS=[
    {t:0,  top:'#06141B', bot:'#0C2630', orb:'#CFe9ff', glow:'rgba(180,210,255,.45)', hg:'rgba(120,160,220,.10)', dark:true},
    {t:0.23,top:'#2A3550', bot:'#7C6E8F', orb:'#FFE3C0', glow:'rgba(255,210,160,.5)', hg:'rgba(255,180,140,.18)', dark:true},
    {t:0.27,top:'#F7B7A3', bot:'#FFE6CC', orb:'#FFD27A', glow:'rgba(255,200,140,.6)', hg:'rgba(255,170,120,.35)', dark:false},
    {t:0.5, top:'#8FC9E8', bot:'#E4F3F7', orb:'#FFF6E0', glow:'rgba(255,245,210,.7)', hg:'rgba(255,240,200,.4)', dark:false},
    {t:0.73,top:'#F0936B', bot:'#FFD194', orb:'#FFB45E', glow:'rgba(255,170,110,.6)', hg:'rgba(255,150,100,.4)', dark:false},
    {t:0.78,top:'#5B4A7A', bot:'#B96A8E', orb:'#FFD9A8', glow:'rgba(255,200,150,.4)', hg:'rgba(220,150,170,.25)', dark:true},
    {t:1,  top:'#06141B', bot:'#0C2630', orb:'#CFE9FF', glow:'rgba(180,210,255,.45)', hg:'rgba(120,160,220,.10)', dark:true}
  ];
  function lerp(a,b,k){return a+(b-a)*k}
  function hex(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}
  function mix(h1,h2,k){const a=hex(h1),b=hex(h2);return `rgb(${a.map((v,i)=>Math.round(lerp(v,b[i],k))).join(',')})`}
  function rgba(c,k){const a=hex(c);return `rgba(${a[0]},${a[1]},${a[2]},${k})`}

  let manualTheme='auto';
  function paintSky(h, frac){
    let i=0; while(i<KEYS.length-1 && frac>KEYS[i+1].t) i++;
    const a=KEYS[i], b=KEYS[Math.min(i+1,KEYS.length-1)];
    const span=(b.t-a.t)||1, k=Math.min(1,Math.max(0,(frac-a.t)/span));
    const top=mix(a.top,b.top,k), bot=mix(a.bot,b.bot,k);
    const isNight = manualTheme==='night' || (manualTheme==='auto' && (h<6||h>=18));
    const sky=document.getElementById('sky');
    if(manualTheme==='night'){ sky.style.background=`linear-gradient(180deg, ${KEYS[0].top}, ${KEYS[0].bot})`; }
    else if(manualTheme==='day'){ sky.style.background=`linear-gradient(180deg, ${KEYS[3].top}, ${KEYS[3].bot})`; }
    else { sky.style.background=`linear-gradient(180deg, ${top}, ${bot})`; }
    document.getElementById('stars').style.opacity = isNight?0.9:0;
    document.getElementById('horizon').style.setProperty('--horizon-glow', mix(a.hg,b.hg,k));
    const orb=document.getElementById('orb');
    orb.style.left=(8+84*frac)+'%';
    const dayArc=Math.sin(Math.PI*Math.min(Math.max((h-6)/12,0),1));
    orb.style.top=(62-44*dayArc)+'%';
    orb.style.setProperty('--orb-color', mix(a.orb,b.orb,k));
    orb.style.setProperty('--orb-glow', rgba(a.orb==b.orb?a.orb:b.orb, .5));
    // 同步 chrome 主题
    const root=document.documentElement;
    if(manualTheme==='auto') root.setAttribute('data-theme', isNight?'night':'day');
    else root.setAttribute('data-theme', manualTheme);
  }

  // ---------- 搜索引擎 ----------
  let engine='baidu';
  const ENGINE_URL={baidu:'https://www.baidu.com/s?wd=', google:'https://www.google.com/search?q=', bing:'https://www.bing.com/search?q='};
  document.getElementById('engines').addEventListener('click',e=>{
    const b=e.target.closest('.engine'); if(!b)return;
    document.querySelectorAll('.engine').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); engine=b.dataset.engine;
  });
  document.getElementById('search').addEventListener('submit',e=>{
    e.preventDefault();
    const q=document.getElementById('searchInput').value.trim(); if(!q)return;
    const url=/^https?:\/\//i.test(q)?q:(ENGINE_URL[engine]+encodeURIComponent(q));
    window.open(url,'_blank');
  });

  // ---------- 主题切换 ----------
  const THEMES=['auto','day','night']; const TXT={auto:'自动',day:'日间',night:'夜间'};
  function cycleTheme(){
    manualTheme=THEMES[(THEMES.indexOf(manualTheme)+1)%3];
    document.getElementById('themeTxt').textContent=TXT[manualTheme];
    tick();
  }
  document.getElementById('themeBtn').addEventListener('click',cycleTheme);
  document.getElementById('dockTheme').addEventListener('click',cycleTheme);

  tick(); setInterval(tick,1000*20);
</script>
</body>
</html>
