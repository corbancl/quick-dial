<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>呲啦起始页 · 重构预览 V4 — 纵轴枢纽</title>
<style>
  /* ============ Token 体系（设计工坊可实时改） ============= */
  :root{
    --qd-bg-0:#0a0e14;
    --qd-bg-1:#0f1620;
    --qd-surface:rgba(255,255,255,.04);
    --qd-surface-2:rgba(255,255,255,.07);
    --qd-border:rgba(255,255,255,.10);
    --qd-text:#e8eef6;
    --qd-text-dim:#8a97a8;
    --qd-accent:#1FE0C7;      /* 电光青 */
    --qd-accent-2:#FF6B4A;    /* 珊瑚 */
    --qd-radius:18px;         /* 设计工坊：圆角 */
    --qd-gap:18px;            /* 设计工坊：间距 */
    --qd-font:15px;           /* 设计工坊：字号 */
    --qd-anim:0.5s;           /* 设计工坊：动画时长 */
    --qd-rail-w:78px;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  /* 浅色（昼） */
  html.light{
    --qd-bg-0:#eef2f7;
    --qd-bg-1:#e3e9f1;
    --qd-surface:rgba(15,22,32,.04);
    --qd-surface-2:rgba(15,22,32,.07);
    --qd-border:rgba(15,22,32,.10);
    --qd-text:#0f1620;
    --qd-text-dim:#5b6776;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Sora","Noto Sans SC",system-ui,sans-serif;
    background:var(--qd-bg-0);
    color:var(--qd-text);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  /* ============ 背景：透视网格地平线 ============= */
  #bg{position:fixed;inset:0;z-index:0;display:block}
  .bg-grad{position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(120% 80% at 50% 120%, color-mix(in srgb,var(--qd-accent) 22%, transparent), transparent 60%),
      radial-gradient(90% 70% at 80% -10%, color-mix(in srgb,var(--qd-accent-2) 16%, transparent), transparent 55%),
      linear-gradient(180deg,var(--qd-bg-1),var(--qd-bg-0));
    transition:background var(--qd-anim) var(--ease);
  }

  /* ============ 左侧 icon 导航轨 ============= */
  .rail{
    position:fixed;left:0;top:0;bottom:0;width:var(--qd-rail-w);z-index:10;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:18px 0;
    background:linear-gradient(180deg,var(--qd-surface-2),transparent);
    backdrop-filter:blur(14px);
    border-right:1px solid var(--qd-border);
  }
  .rail .brand{
    width:42px;height:42px;border-radius:13px;overflow:hidden;
    display:grid;place-items:center;background:transparent;
    box-shadow:0 6px 20px rgba(59,130,246,.28);
    margin-bottom:14px;
  }
  .rail .brand-img{width:100%;height:100%;object-fit:contain;display:block;}
  .rail .anchor{
    width:46px;height:46px;border-radius:14px;border:1px solid transparent;
    display:grid;place-items:center;color:var(--qd-text-dim);cursor:pointer;
    transition:all var(--qd-anim) var(--ease);font-size:20px;
  }
  .rail .anchor:hover,.rail .anchor.active{
    color:var(--qd-text);background:var(--qd-surface);
    border-color:var(--qd-border);transform:translateX(3px);
  }
  .rail .anchor.active{box-shadow:inset 3px 0 0 var(--qd-accent)}
  .rail .spacer{flex:1}
  .rail .anchor svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}

  /* ============ 主区 ============= */
  .main{
    position:relative;z-index:5;height:100%;
    margin-left:var(--qd-rail-w);
    padding:34px 40px 40px;
    overflow-y:auto;overflow-x:hidden;
    scroll-behavior:smooth;
  }
  .main::-webkit-scrollbar{width:8px}
  .main::-webkit-scrollbar-thumb{background:var(--qd-border);border-radius:8px}

  /* 顶部 hero：左大时钟 + 右情景 */
  .hero{display:flex;gap:var(--qd-gap);align-items:stretch;margin-bottom:var(--qd-gap)}
  .hero-clock{
    flex:1;max-width:420px;min-height:200px;border-radius:calc(var(--qd-radius) + 6px);
    background:var(--qd-surface);border:1px solid var(--qd-border);
    padding:26px 30px;display:flex;flex-direction:column;justify-content:center;
    position:relative;overflow:hidden;
  }
  .hero-clock::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;
    background:radial-gradient(circle,color-mix(in srgb,var(--qd-accent) 30%,transparent),transparent 70%);
    filter:blur(8px);opacity:.6}
  .clock-host{position:relative;z-index:1}
  .hero-side{flex:1.2;display:flex;flex-direction:column;gap:var(--qd-gap)}
  .mini-row{display:flex;gap:12px;flex:1}
  .mini-row .chip{flex:1;padding:14px 16px}
  .to-top{position:fixed;right:26px;bottom:26px;z-index:30;width:48px;height:48px;border-radius:50%;
    border:1px solid var(--qd-border);background:var(--qd-surface-2);backdrop-filter:blur(10px);
    color:var(--qd-text);cursor:pointer;display:grid;place-items:center;
    opacity:0;transform:translateY(14px) scale(.9);pointer-events:none;
    transition:all var(--qd-anim) var(--ease);box-shadow:0 8px 24px rgba(0,0,0,.3)}
  .to-top.show{opacity:1;transform:none;pointer-events:auto}
  .to-top:hover{border-color:var(--qd-accent);color:var(--qd-accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--qd-accent) 14%,transparent)}
  .to-top svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .chip{
    flex:1;border-radius:var(--qd-radius);background:var(--qd-surface);
    border:1px solid var(--qd-border);padding:16px 20px;
    display:flex;flex-direction:column;justify-content:center;gap:6px;
    transition:transform var(--qd-anim) var(--ease),border-color var(--qd-anim) var(--ease);
  }
  .chip:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--qd-accent) 50%,var(--qd-border))}
  .chip .k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--qd-text-dim)}
  .chip .v{font-size:calc(var(--qd-font) + 5px);font-weight:600}
  .chip .v small{display:block;font-size:13px;color:var(--qd-text-dim);font-weight:400;margin-top:3px}

  /* 搜索行 */
  .search-row{display:flex;gap:10px;margin-bottom:calc(var(--qd-gap) + 6px);max-width:760px}
  .engine-btn{
    flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 16px;
    border-radius:var(--qd-radius);background:var(--qd-surface-2);border:1px solid var(--qd-border);
    color:var(--qd-text);cursor:pointer;font-size:var(--qd-font);font-weight:600;
  }
  .engine-btn .dot{width:9px;height:9px;border-radius:50%;background:var(--qd-accent)}
  .engine-btn svg{width:14px;height:14px;stroke:var(--qd-text-dim);fill:none;stroke-width:2}
  .search-box{
    flex:1;display:flex;align-items:center;gap:12px;padding:0 20px;
    border-radius:var(--qd-radius);background:var(--qd-surface-2);
    border:1px solid var(--qd-border);transition:border-color var(--qd-anim) var(--ease),box-shadow var(--qd-anim) var(--ease);
  }
  .search-box:focus-within{border-color:var(--qd-accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--qd-accent) 14%,transparent)}
  .search-box svg{width:20px;height:20px;stroke:var(--qd-text-dim);fill:none;stroke-width:1.8}
  .search-box input{flex:1;background:none;border:0;outline:none;color:var(--qd-text);font-size:calc(var(--qd-font) + 1px);font-family:inherit;padding:15px 0}

  /* 分组横向滑动轨道 */
  .track-block{margin-bottom:calc(var(--qd-gap) + 8px)}
  .track-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .track-head .name{font-size:calc(var(--qd-font) + 1px);font-weight:700;letter-spacing:.02em}
  .track-head .bar{width:22px;height:3px;border-radius:3px;background:var(--qd-accent)}
  .track-head .pro{font-size:10px;padding:2px 7px;border-radius:20px;background:color-mix(in srgb,var(--qd-accent-2) 22%,transparent);color:var(--qd-accent-2);font-weight:700}
  .track{display:flex;gap:var(--qd-gap);overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
  .track::-webkit-scrollbar{height:6px}
  .track::-webkit-scrollbar-thumb{background:var(--qd-border);border-radius:6px}
  .card{
    scroll-snap-align:start;flex:0 0 auto;width:128px;height:108px;border-radius:var(--qd-radius);
    background:var(--qd-surface);border:1px solid var(--qd-border);
    padding:16px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;
    transition:transform var(--qd-anim) var(--ease),border-color var(--qd-anim) var(--ease),background var(--qd-anim);
    position:relative;overflow:hidden;
  }
  .card:hover{transform:translateY(-5px);border-color:var(--qd-accent);background:var(--qd-surface-2)}
  .card .badge{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:800;color:#06121a;font-size:15px}
  .card .t{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .u{font-size:11px;color:var(--qd-text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--qd-c,var(--qd-accent));opacity:.85}

  /* 设置抽屉 */
  .scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity var(--qd-anim) var(--ease)}
  .scrim.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,92vw);z-index:50;
    background:var(--qd-bg-1);border-left:1px solid var(--qd-border);
    transform:translateX(100%);transition:transform var(--qd-anim) var(--ease);
    display:flex;flex-direction:column}
  .drawer.open{transform:none}
  .drawer header{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--qd-border)}
  .drawer header h3{font-size:17px}
  .drawer header .x{cursor:pointer;color:var(--qd-text-dim);font-size:22px;line-height:1}
  .tabs{display:flex;gap:6px;padding:14px 22px 0}
  .tab{flex:1;text-align:center;padding:9px 0;border-radius:11px;font-size:13px;font-weight:600;color:var(--qd-text-dim);cursor:pointer;background:var(--qd-surface)}
  .tab.active{color:var(--qd-bg-0);background:var(--qd-accent)}
  .tab-body{padding:20px 22px;overflow-y:auto;flex:1}
  .field{margin-bottom:18px}
  .field label{display:block;font-size:12.5px;color:var(--qd-text-dim);margin-bottom:8px;letter-spacing:.02em}
  .seg{display:flex;flex-wrap:wrap;gap:7px}
  .seg button{padding:7px 13px;border-radius:10px;border:1px solid var(--qd-border);background:var(--qd-surface);color:var(--qd-text);cursor:pointer;font-size:12.5px;font-family:inherit;transition:all .2s var(--ease)}
  .seg button.on{background:var(--qd-accent);color:var(--qd-bg-0);border-color:var(--qd-accent);font-weight:700}
  .seg button.lock{opacity:.55}
  .seg button.lock::after{content:" PRO";font-size:9px;color:var(--qd-accent-2)}
  .slider{display:flex;align-items:center;gap:12px}
  .slider input[type=range]{flex:1;accent-color:var(--qd-accent)}
  .slider .val{font-size:12px;color:var(--qd-text-dim);width:54px;text-align:right}
  .row-line{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--qd-border);font-size:13.5px}
  .switch{width:42px;height:24px;border-radius:20px;background:var(--qd-surface-2);border:1px solid var(--qd-border);position:relative;cursor:pointer;transition:background .2s}
  .switch.on{background:var(--qd-accent)}
  .switch::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .2s var(--ease)}
  .switch.on::after{left:20px}
  .btn{width:100%;padding:11px;border-radius:11px;border:1px solid var(--qd-border);background:var(--qd-surface-2);color:var(--qd-text);cursor:pointer;font-family:inherit;font-size:13px;margin-top:6px}
  .btn.primary{background:var(--qd-accent);color:var(--qd-bg-0);border-color:var(--qd-accent);font-weight:700}

  /* 时钟样式渲染 */
  .clk-digital{font-family:"Space Grotesk",sans-serif;font-size:62px;font-weight:700;letter-spacing:.01em;font-variant-numeric:tabular-nums}
  .clk-digital .ap{font-size:18px;color:var(--qd-accent);margin-left:10px;vertical-align:middle}
  .clk-minimal{font-family:"Space Grotesk",sans-serif;font-size:54px;font-weight:300;color:var(--qd-text-dim)}
  .clk-minimal b{color:var(--qd-text);font-weight:600}
  .clk-classic{font-family:"Space Grotesk",serif;font-size:56px;font-weight:500;border-bottom:2px solid var(--qd-accent);padding-bottom:6px;display:inline-block}
  .clk-flip{display:flex;gap:8px}
  .clk-flip .f{background:var(--qd-bg-0);border:1px solid var(--qd-border);border-radius:10px;padding:10px 14px;font-family:"Space Grotesk";font-size:46px;font-weight:700;font-variant-numeric:tabular-nums;box-shadow:inset 0 -8px 14px rgba(0,0,0,.25)}
  .clk-flip .colon{display:grid;place-items:center;font-size:40px;color:var(--qd-accent)}
  .clk-neon{font-family:"Space Grotesk";font-size:58px;font-weight:700;color:#fff;text-shadow:0 0 6px var(--qd-accent),0 0 18px var(--qd-accent),0 0 38px color-mix(in srgb,var(--qd-accent) 60%,transparent)}
  .clk-binary{font-family:"Space Grotesk";font-size:18px;line-height:1.5;color:var(--qd-accent);letter-spacing:.18em;white-space:pre}
  .clk-sub{font-size:13px;color:var(--qd-text-dim);margin-top:10px}

  @media (max-width:880px){
    .hero{flex-direction:column}
    .main{padding:24px 18px 30px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

      <div class="field"><label>动画时长</label><div class="slider"><input type="range" min="0" max="1.2" step="0.05" value="0.5" data-tok="--qd-anim"><span class="val" id="v-anim"></span></div></div>
      <div class="field"><label>主色（电光青）</label><div class="slider"><input type="range" min="0" max="360" value="168" data-tok="hue1"><span class="val" id="v-hue1"></span></div></div>
      <div class="field"><label>辅色（珊瑚）</label><div class="slider"><input type="range" min="0" max="360" value="12" data-tok="hue2"><span class="val" id="v-hue2"></span></div></div>
      <button class="btn" id="resetTokens">重置为默认</button>
      <button class="btn primary" id="exportTokens">导出主题 JSON</button>
    </div>
    <!-- PRO -->
    <div data-panel="pro" style="display:none">
      <div class="field"><label>自定义标题</label><input class="search-box" style="padding:0 14px;height:42px" value="我的起始页"></div>
      <div class="field"><label>底部文案</label><input class="search-box" style="padding:0 14px;height:42px" value="Powered by 呲啦起始页"></div>
      <div class="row-line"><span>隐藏品牌标识</span><div class="switch" data-sw="hidebrand"></div></div>
      <div class="row-line"><span>云同步导航</span><div class="switch on" data-sw="sync"></div></div>
      <div class="row-line"><span>自定义壁纸</span><div class="switch" data-sw="wallpaper"></div></div>
      <button class="btn primary">管理 PRO 订阅</button>
    </div>
  </div>
</aside>

<script>
/* ===================== 真实项目数据（来自 src/） ===================== */
const ENGINES=[
  {id:'bing',name:'必应',url:'https://www.bing.com/search?q=',free:true},
  {id:'baidu',name:'百度',url:'https://www.baidu.com/s?wd=',free:true},
  {id:'google',name:'Google',url:'https://www.google.com/search?q=',free:true},
  {id:'duckduckgo',name:'DuckDuckGo',url:'https://duckduckgo.com/?q=',free:true},
  {id:'sogou',name:'搜狗',url:'https://www.sogou.com/web?query=',free:true},
  {id:'360',name:'360',url:'https://www.so.com/s?q=',free:true},
  {id:'github',name:'GitHub',url:'https://github.com/search?q=',free:false},
  {id:'youtube',name:'YouTube',url:'https://www.youtube.com/results?search_query=',free:false},
  {id:'zhihu',name:'知乎',url:'https://www.zhihu.com/search?type=content&q=',free:false},
  {id:'bilibili',name:'B站',url:'https://search.bilibili.com/all?keyword=',free:false},
  {id:'taobao',name:'淘宝',url:'https://s.taobao.com/search?q=',free:false},
  {id:'jd',name:'京东',url:'https://search.jd.com/Search?keyword=',free:false},
  {id:'npm',name:'npm',url:'https://www.npmjs.com/search?q=',free:false},
];
const GROUPS=[
  {id:'common',name:'常用',color:'#1FE0C7',sites:[
    {t:'Gmail',u:'mail.google.com',c:'#EA4335'},{t:'微信',u:'weixin.qq.com',c:'#07C160'},
    {t:'GitHub',u:'github.com',c:'#ffffff'},{t:'YouTube',u:'youtube.com',c:'#FF0000'},
    {t:'B站',u:'bilibili.com',c:'#FB7299'},{t:'知乎',u:'zhihu.com',c:'#0084FF'},
    {t:'淘宝',u:'taobao.com',c:'#FF5000'},{t:'抖音',u:'douyin.com',c:'#000000'},
  ]},
  {id:'work',name:'工作',color:'#FF6B4A',sites:[
    {t:'飞书',u:'feishu.cn',c:'#3370FF'},{t:'钉钉',u:'dingtalk.com',c:'#3296FA'},
    {t:'腾讯文档',u:'docs.qq.com',c:'#0AE05A'},{t:'Notion',u:'notion.so',c:'#ffffff'},
    {t:'Trello',u:'trello.com',c:'#0079BF'},{t:'Figma',u:'figma.com',c:'#F24E1E'},
  ]},
  {id:'design',name:'设计',color:'#A78BFA',sites:[
    {t:'Dribbble',u:'dribbble.com',c:'#EA4C89'},{t:'Behance',u:'behance.net',c:'#1769FF'},
    {t:'花瓣',u:'huaban.com',c:'#FF6600'},{t:'站酷',u:'zcool.com.cn',c:'#FFD400'},
    {t:'Unsplash',u:'unsplash.com',c:'#000000'},{t:'Coolor',u:'coolors.co',c:'#00CC99'},
  ]},
  {id:'fun',name:'娱乐',color:'#FFC773',sites:[
    {t:'网易云',u:'music.163.com',c:'#C20C0C'},{t:'QQ音乐',u:'y.qq.com',c:'#31C27C'},
    {t:'爱奇艺',u:'iqiyi.com',c:'#00BE06'},{t:'优酷',u:'youku.com',c:'#00A4E8'},
    {t:'Steam',u:'store.steampowered.com',c:'#1B2838'},{t:'Spotify',u:'spotify.com',c:'#1DB954'},
  ]},
];
const CLOCK_STYLES=[
  {id:'digital',name:'数字'},{id:'minimal',name:'极简'},{id:'classic',name:'经典'},
  {id:'flip',name:'翻牌'},{id:'neon',name:'霓虹'},{id:'binary',name:'二进制'},
];
const THEMES=[
  {id:'aurora',name:'极光',free:true},{id:'coral',name:'珊瑚',free:true},
  {id:'mint',name:'薄荷',free:true},{id:'ink',name:'墨黑',free:true},
  {id:'sunset',name:'日落',free:false},{id:'ocean',name:'深海',free:false},
  {id:'mono',name:'极简灰',free:false},{id:'candy',name:'糖果',free:false},
];

/* ===================== 状态 ===================== */
let state={engine:'bing',clock:'digital',theme:'aurora',layout:'centered',
  hue1:168,hue2:12};

/* ===================== 时钟渲染（6 样式真实渲染） ===================== */
function pad(n){return String(n).padStart(2,'0')}
function renderClock(){
  const d=new Date(),h=d.getHours(),m=pad(d.getMinutes()),s=pad(d.getSeconds());
  const ap=h<12?'AM':'PM',H12=h%12||12;
  const host=document.getElementById('clockHost');
  let html='';
  switch(state.clock){
    case 'digital':html=`<div class="clk-digital">${H12}:${m}<span class="ap">${ap}</span></div>`;break;
    case 'minimal':html=`<div class="clk-minimal">${H12}<b>:${m}</b></div>`;break;
    case 'classic':html=`<div class="clk-classic">${pad(h)}:${m}</div>`;break;
    case 'flip':html=`<div class="clk-flip"><div class="f">${pad(h)}</div><div class="colon">:</div><div class="f">${m}</div><div class="colon">:</div><div class="f">${s}</div></div>`;break;
    case 'neon':html=`<div class="clk-neon">${pad(h)}:${m}:${s}</div>`;break;
    case 'binary':{
      const b=n=>n.toString(2).padStart(6,'0');
      html=`<div class="clk-binary">${b(h)} : ${b(+m)}\n${b(+s)}  HH:MM:SS</div>`;break;}
  }
  const wd=['日','一','二','三','四','五','六'][d.getDay()];
  html+=`<div class="clk-sub">${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · 星期${wd}</div>`;
  host.innerHTML=html;
}
setInterval(renderClock,1000);renderClock();

/* ===================== 引擎 ===================== */
function renderEngine(){document.getElementById('engineName').textContent=ENGINES.find(e=>e.id===state.engine).name}
document.getElementById('engineBtn').onclick=()=>{
  const cur=ENGINES.findIndex(e=>e.id===state.engine);
  state.engine=ENGINES[(cur+1)%ENGINES.length].id;renderEngine();
};
document.getElementById('searchInput').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const q=e.target.value.trim();if(!q)return;
  const eng=ENGINES.find(x=>x.id===state.engine);
  const isUrl=/^https?:\/\//.test(q)||/\.[a-z]{2,}$/i.test(q)&&!q.includes(' ');
  location.href=isUrl?(q.startsWith('http')?q:'https://'+q):eng.url+encodeURIComponent(q);
});

/* ===================== 分组横向轨道 ===================== */
function renderTracks(){
  const box=document.getElementById('tracks');
  box.innerHTML=GROUPS.map(g=>`
    <div class="track-block" id="g-${g.id}">
      <div class="track-head"><span class="bar" style="background:${g.color}"></span><span class="name">${g.name}</span></div>
      <div class="track">
        ${g.sites.map(s=>`
          <div class="card" style="--qd-c:${g.color}" onclick="location.href='https://${s.u}'">
            <div class="badge" style="background:${s.c}">${s.t[0]}</div>
            <div><div class="t">${s.t}</div><div class="u">${s.u}</div></div>
          </div>`).join('')}
      </div>
    </div>`).join('');
}

/* ===================== 设置：分段控件 ===================== */
function buildSeg(el,items,getVal,setVal){
  el.innerHTML=items.map(it=>`<button data-v="${it.id}" class="${it.free===false?'lock':''} ${getVal()===it.id?'on':''}">${it.name}</button>`).join('');
  el.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.classList.contains('lock')){alert('该主题/引擎为 PRO 功能');return}
    setVal(b.dataset.v);[...el.children].forEach(c=>c.classList.toggle('on',c===b));};
}
buildSeg(document.getElementById('themeSeg'),THEMES,()=>state.theme,v=>{state.theme=v;applyTheme()});
buildSeg(document.getElementById('clockSeg'),CLOCK_STYLES,()=>state.clock,v=>{state.clock=v;renderClock()});
buildSeg(document.getElementById('engineSeg'),ENGINES,()=>state.engine,v=>{if(ENGINES.find(e=>e.id===v).free===false){alert('该引擎为 PRO 功能');return}state.engine=v;renderEngine()});
document.getElementById('layoutSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;state.layout=b.dataset.v;[...e.currentTarget.children].forEach(c=>c.classList.toggle('on',c===b))};

/* ===================== 主题色应用 ===================== */
function applyTheme(){
  const map={aurora:[168,77],coral:[12,200],mint:[155,55],ink:[200,30],sunset:[20,320],ocean:[200,210],mono:[220,220],candy:[330,300]};
  const [h1,h2]=map[state.theme]||[state.hue1,state.hue2];
  setHue(h1,h2);
}
function setHue(h1,h2){
  const r=h=>{state['hue'+(h===h1?1:2)]=h;};r(h1);r(h2);
  document.documentElement.style.setProperty('--qd-accent',`hsl(${h1} 80% 55%)`);
  document.documentElement.style.setProperty('--qd-accent-2',`hsl(${h2} 85% 62%)`);
}

/* ===================== 设计工坊滑块 ===================== */
document.querySelectorAll('.slider input').forEach(inp=>{
  const tok=inp.dataset.tok;
  const out=document.getElementById('v-'+tok.replace('--qd-','').replace('hue1','hue1').replace('hue2','hue2'));
  const upd=()=>{
    if(tok==='hue1'){setHue(+inp.value,state.hue2);out.textContent=inp.value+'°';}
    else if(tok==='hue2'){setHue(state.hue1,+inp.value);out.textContent=inp.value+'°';}
    else{document.documentElement.style.setProperty(tok,inp.value+(tok==='--qd-font'?'px':tok==='--qd-anim'?'s':'px'));out.textContent=inp.value+(tok==='--qd-anim'?'s':'px');}
  };
  inp.addEventListener('input',upd);upd();
});
document.getElementById('resetTokens').onclick=()=>location.reload();
document.getElementById('exportTokens').onclick=()=>{
  const css=getComputedStyle(document.documentElement);
  const cfg={radius:css.getPropertyValue('--qd-radius').trim(),gap:css.getPropertyValue('--qd-gap').trim(),
    font:css.getPropertyValue('--qd-font').trim(),anim:css.getPropertyValue('--qd-anim').trim(),
    accent:css.getPropertyValue('--qd-accent').trim(),accent2:css.getPropertyValue('--qd-accent-2').trim()};
  alert('主题 JSON：\n'+JSON.stringify(cfg,null,2));
};

/* ===================== Tab 切换 ===================== */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));
  const name=t.dataset.tab;
  document.querySelectorAll('.tab-body > div').forEach(p=>p.style.display=p.dataset.panel===name?'block':'none');
});
/* 开关 */
document.querySelectorAll('.switch[data-sw]').forEach(s=>s.onclick=()=>s.classList.toggle('on'));

/* ===================== 抽屉 / 昼夜 / 锚点 ===================== */
const drawer=document.getElementById('drawer'),scrim=document.getElementById('scrim');
const openD=()=>{drawer.classList.add('open');scrim.classList.add('open')};
const closeD=()=>{drawer.classList.remove('open');scrim.classList.remove('open')};
document.getElementById('openSettings').onclick=openD;
document.getElementById('closeSettings').onclick=closeD;scrim.onclick=closeD;
document.getElementById('dayToggle').onclick=()=>document.documentElement.classList.toggle('light');
document.querySelectorAll('.anchor[data-go]').forEach(a=>a.onclick=()=>{
  document.querySelectorAll('.anchor[data-go]').forEach(x=>x.classList.remove('active'));
  a.classList.add('active');
  const go=a.dataset.go;
  if(go==='top')document.getElementById('main').scrollTo({top:0,behavior:'smooth'});
  else document.getElementById(go)?.scrollIntoView({behavior:'smooth',block:'start'});
});

renderEngine();renderTracks();applyTheme();

/* 返回顶部 */
const mainEl=document.getElementById('main'),toTop=document.getElementById('toTop');
mainEl.addEventListener('scroll',()=>toTop.classList.toggle('show',mainEl.scrollTop>240));
toTop.onclick=()=>mainEl.scrollTo({top:0,behavior:'smooth'});

/* ===================== 背景：透视网格地平线 ===================== */
const cv=document.getElementById('bg'),ctx=cv.getContext('2d');
let W,H,t=0;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}
addEventListener('resize',resize);resize();
function accent(){const c=getComputedStyle(document.documentElement).getPropertyValue('--qd-accent').trim()||'#1FE0C7';return c}
function frame(){
  t+=0.006;
  ctx.clearRect(0,0,W,H);
  const horizon=H*0.62;
  // 地平线辉光
  const g=ctx.createLinearGradient(0,horizon-2,0,horizon+2);
  g.addColorStop(0,'transparent');g.addColorStop(.5,accent());g.addColorStop(1,'transparent');
  ctx.strokeStyle=g;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,horizon);ctx.lineTo(W,horizon);ctx.stroke();
  // 透视纵线
  ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=1;
  const cx=W/2;
  for(let i=-10;i<=10;i++){
    ctx.beginPath();ctx.moveTo(cx+i*30,horizon);
    ctx.lineTo(cx+i*220, H);ctx.stroke();
  }
  // 横向网格（随 t 向前滚动）
  for(let i=0;i<14;i++){
    const p=(i+ (t%1))/14;
    const y=horizon+Math.pow(p,2.2)*(H-horizon);
    ctx.strokeStyle=`rgba(255,255,255,${0.04+0.05*(1-p)})`;
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  }
  // 上方漂浮光点（星 / 尘）
  for(let i=0;i<40;i++){
    const x=(i*97.3)%W, y=((i*53.7 + t*40)%horizon);
    ctx.fillStyle=`rgba(255,255,255,${0.15+0.25*Math.sin(t*2+i)})`;
    ctx.fillRect(x,y,1.6,1.6);
  }
  requestAnimationFrame(frame);
}
frame();
</script>
